# ==============================================================================
# SUPERVISOR QUEUE WORKER CONFIGURATION - AREA KERJA
# ==============================================================================
# File ini menjaga proses antrean background (Job email, notifikasi, dll)
# tetap berjalan di VPS dan otomatis hidup kembali jika terjadi crash.
#
# Cara pasang di Ubuntu/Debian:
# 1. Salin file ini ke: /etc/supervisor/conf.d/areakerja-worker.conf
# 2. Perbarui supervisor:
#    sudo supervisorctl reread
#    sudo supervisorctl update
#    sudo supervisorctl start areakerja-worker:*
# ==============================================================================

[program:areakerja-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/areakerja/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/areakerja/storage/logs/worker.log
stopwaitsecs=3600
