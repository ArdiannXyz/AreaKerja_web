# ==============================================================================
# NGINX SERVER BLOCK CONFIGURATION - AREA KERJA
# ==============================================================================
# Salin file ini ke: /etc/nginx/sites-available/areakerja.conf
# Lalu aktifkan symlink:
#   sudo ln -s /etc/nginx/sites-available/areakerja.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Pasang SSL gratis Let's Encrypt:
#   sudo certbot --nginx -d areakerja.com -d www.areakerja.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name areakerja.com www.areakerja.com; # Ganti dengan domain Anda

    root /var/www/areakerja/public; # Ganti dengan path direktori public Laravel Anda
    index index.php index.html index.htm;

    charset utf-8;

    # Ukuran maksimal upload dokumen/CV pelamar & bukti transfer
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Logging
    access_log /var/log/nginx/areakerja_access.log;
    error_log /var/log/nginx/areakerja_error.log error;

    # Routing Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
    
    location = /robots.txt { 
        access_log off; 
        log_not_found off; 
    }

    error_page 404 /index.php;

    # PHP-FPM Handler
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Sesuaikan versi PHP VPS (8.2 / 8.3)
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Cache file statis (CSS, JS, Gambar, Font)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Proteksi file tersembunyi (.env, .git, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
